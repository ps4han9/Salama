<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALAMA STORE - Poops Exploit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Black+Ops+One&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --emerald-green: #00ff88; --emerald-glow: rgba(0, 255, 136, 0.6); --dark-bg: rgba(15, 22, 25, 0.92); --panel-border: rgba(0, 255, 136, 0.3); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; background: #000; color: #fff; font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden; }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0, 255, 136, 0.05) 0%, rgba(0,0,0,0.95) 100%); z-index: 0; }
  .hud-container { position: relative; z-index: 1; width: 95%; max-width: 850px; background: var(--dark-bg); border: 2px solid var(--panel-border); border-radius: 16px; padding: 40px 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(0, 255, 136, 0.08); }
  .hud-container::before { content: ''; position: absolute; top: 0; left: 30px; right: 30px; height: 3px; background: var(--emerald-green); box-shadow: 0 5px 15px var(--emerald-glow); }
  .brand-title { font-family: 'Black Ops One', 'Orbitron', cursive; font-size: 4rem; text-align: center; color: #fff; letter-spacing: 5px; margin-bottom: 5px; text-transform: uppercase; direction: ltr; text-shadow: 2px 2px 0px #000, 4px 4px 0px var(--emerald-green); }
  .brand-title span { color: var(--emerald-green); }
  .brand-ar { font-size: 1.5rem; text-align: center; color: var(--emerald-green); font-weight: 900; letter-spacing: 1px; margin-bottom: 5px; text-shadow: 0 0 10px var(--emerald-glow); }
  .brand-sub { font-size: 1.2rem; text-align: center; color: #ccc; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; direction: ltr; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
  .status-panel { background: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 8px; border: 1px dashed rgba(0, 255, 136, 0.4); margin-bottom: 15px; position: relative; box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9); }
  .status-panel::before { content: 'EXECUTION'; position: absolute; top: -12px; right: 15px; background: var(--emerald-green); color: #000; padding: 2px 10px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 3px; }
  #state { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 10px var(--emerald-glow); text-align: center; margin-bottom: 10px; }
  .loader-wrapper { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dot { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; animation: bounce 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: 0.2s; background: var(--emerald-green); box-shadow: 0 0 10px var(--emerald-green); } .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { to { transform: translateY(-10px); opacity: 0.5; } }
  #out-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; background: rgba(0, 0, 0, 0.85); border: 1px solid var(--panel-border); border-radius: 8px; padding: 14px; max-height: 250px; overflow-y: auto; color: #c8ced8; direction: ltr; text-align: left; }
  .done { color: #00ff88 !important; text-shadow: 0 0 10px #00ff88 !important; } .error { color: #ff3333 !important; text-shadow: 0 0 10px #ff3333 !important; }
  .powered-by { position: fixed; bottom: 12px; right: 20px; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.3); z-index: 10; direction: ltr; }
  .powered-by span { color: var(--emerald-green); font-weight: 900; text-shadow: 0 0 8px var(--emerald-green); }
  .footer-sys { position: fixed; bottom: 12px; left: 20px; font-family: 'Orbitron', sans-serif; font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 2px; z-index: 10; direction: ltr; }
  @media (max-width: 600px) { .brand-title { font-size: 2.5rem; } .brand-ar { font-size: 1.2rem; } .hud-container { padding: 30px 15px; } .powered-by { font-size: 10px; right: 10px; } .footer-sys { font-size: 9px; left: 10px; } }
</style>
</head>
<body>
<div class="hud-container">
  <h1 class="brand-title">SALAMA <span>STORE</span></h1>
  <div class="brand-ar">سلامه استور</div>
  <div class="brand-sub">POOPS EXPLOIT</div>
  <div class="status-panel"><div id="state"><span id="stateText">جارٍ تحميل سلسلة Poops<br><small>Please Wait...</small></span><div class="loader-wrapper"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div>
  <div id="out-container"><div id="out"></div></div>
</div>
<div class="powered-by">POWERED BY <span>MAHMOUD FATHY</span></div>
<div class="footer-sys">SALAMA OS v1.0 - Poops</div>
<script type="module">
import "./chain_poops.js";
const state = document.getElementById("state"), stateText = document.getElementById("stateText");
window.poopsDone = function () { state.classList.add("done"); stateText.innerHTML = "اكتملت العملية بنجاح<br><small>EXPLOIT SUCCESSFUL</small>"; document.querySelector('.loader-wrapper').style.display = 'none'; };
window.poopsError = function () { state.classList.add("error"); stateText.innerHTML = "حدث خطأ أثناء التنفيذ<br><small>EXPLOIT FAILED</small>"; document.querySelector('.loader-wrapper').style.display = 'none'; };
</script>
</body>
</html>
